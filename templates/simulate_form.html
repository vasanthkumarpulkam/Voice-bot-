<!DOCTYPE html>
<html>
<head>
    <title>Simulate Twilio Call</title>
</head>
<body>
    <h1>Simulate an Incoming Call</h1>
    <form action="/simulate_twilio_call" method="post">
        <label for="name_company">Name & Company:</label><br>
        <input type="text" id="name_company" name="name_company" placeholder="John Doe from Google" required><br><br>

        <label for="reason">Reason for Call:</label><br>
        <input type="text" id="reason" name="reason" placeholder="Calling about a new project" required><br><br>

        <button type="submit">Simulate Call</button>
    </form>
</body>
</html>
